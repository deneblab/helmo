name: image

on:
  push:
    branches: [develop, production]
  pull_request:

permissions:
  contents: read

env:
  ABCVERSION_VERSION: 1.2.19
  # Checked here, not fetched next to the binary. Bump both together.
  ABCVERSION_SHA256: 32610791f90dc0cb40ad3b850d4e52398c3e5eb17535109c769b6eb6cc017564
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Lint shell scripts
        run: shellcheck -s sh scripts/*.sh
      - name: Vet and test
        working-directory: src
        run: |
          go vet ./...
          go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release of a published version
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # abcversion counts commits
      - name: Install abcversion
        run: |
          curl -fsSL -o /usr/local/bin/abcversion \
            "https://github.com/deneblab/abcversion/releases/download/v${ABCVERSION_VERSION}/abcversion-linux-x64"
          echo "${ABCVERSION_SHA256}  /usr/local/bin/abcversion" | sha256sum -c -
          chmod +x /usr/local/bin/abcversion
      - name: Compute version
        id: version
        run: echo "version=$(abcversion -p semversion)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/production'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # Only production publishes: develop and production number their commits
          # differently, so a develop image could clash with a later release.
          push: ${{ github.ref == 'refs/heads/production' }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          # Links the package to this repository, so it shows on the repo page.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      # A release per published image: the repo page and the README badge show
      # the current version. Re-running the job does not create a second one.
      - name: Create GitHub release
        if: github.ref == 'refs/heads/production'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION exists"
            exit 0
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Helmo $VERSION" \
            --notes "Image: \`ghcr.io/${GITHUB_REPOSITORY}:$VERSION\`

          Update: set \`HELMO_TAG=$VERSION\` in Helmo's \`.env\` and run \`docker compose up -d\`."
